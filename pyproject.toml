[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imageviewer"
version = "0.1.0"
description = "基于 Flet 的桌面端轻量看图软件（IrfanView 风格交互）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 界面层只 import `ui`（基于 flet 的本地组件库 cs-ui）；flet 由其间接依赖带入。
    # 开发期：py -3.12 -m pip install -e ../cs-ui（editable，装完版本为 0.2.0）
    # 打包期：索引上只发布到 0.1.1，>=0.2.0 需由本地 wheel + PIP_FIND_LINKS 提供，
    #         具体步骤见 README「打包」一节，否则 flet build 会解析依赖失败。
    "cs-ui>=0.2.0",
    "pillow>=10.4",
    "send2trash>=1.8.3",
]

[project.optional-dependencies]
heif = ["pillow-heif>=1.0"]
raw = ["rawpy>=0.20"]
svg = ["resvg>=0.2.0"]
apng = ["apng>=0.3"]
# 一次装齐全部特殊格式
formats = ["imageviewer[heif,raw,svg,apng]"]
# 仅用于打包（flet build 由 flet-cli 提供）
build = ["flet-cli>=1.0.0"]

[project.scripts]
imageviewer = "main:run"
imageviewer-assoc = "cs_image_viewer.infra.association:main"   # Windows“打开方式”文件关联
imageviewer-daemon = "cs_image_viewer.infra.shared.daemon:main"  # 常驻共享缓存（无窗口）

[tool.setuptools]
# src 布局：包位于 src/cs_image_viewer/，main.py 仍在仓库根（flet build 的入口，
# 组合根，不能挪进 src）。空串键把顶层模块留在根，只把 cs_image_viewer 映射到 src；
# 子包（models / infra / ...）由 packages.find 自动发现，新增分层免维护。
# 不能写成 package-dir = { "" = "src" }：那样 main.py 会被静默漏出 wheel /
# editable 映射，控制台脚本 imageviewer = "main:run" 随即失效。
py-modules = ["main"]
package-dir = { "" = ".", "cs_image_viewer" = "src/cs_image_viewer" }

[tool.setuptools.packages.find]
# 从 src 发现 cs_image_viewer 及其全部子包（含新增分层）。
where = ["src"]
include = ["cs_image_viewer*"]

# ---------------------------------------------------------------------------
# Flet 打包配置（flet build windows / macos / linux）
# 注意：目录下若存在 requirements.txt，flet build 会优先读它而忽略本文件 —— 已移除。
# ---------------------------------------------------------------------------
[tool.flet]
org = "com.imageviewer"
product = "ImageViewer"
company = "ImageViewer"
copyright = "Copyright (C) 2026 ImageViewer"
build_number = 1

[tool.flet.app]
module = "main"
path = "."
exclude = [".cowork-temp/**", "dist/**", "**/__pycache__"]
# 窗口以隐藏状态创建，等 main.py 把 UI 布置好、居中后再显示。
# 这是「打开时不闪白屏、不从左上角跳位」的关键开关（对应 flet_generated.dart
# 里的 hideWindowOnStart）；没有它，Flutter 会在首帧就把 1280x720 的窗口
# 以白色启动屏画在桌面左上角 (10,10)。
hide_window_on_start = true

# 启动屏（窗口万一提前显示时的兜底）：深色底 + 深色转圈，
# 不留任何白色帧。颜色键名见 flet 的 FletBootScreen。
#
# bgcolor 必须与 cs_image_viewer/view/design.py 的 C_SURFACE 一致（当前 #141518，
# 由 MediaPalette.derive(BRAND_PRIMARY, "dark").surface 推导）。
# 静态 TOML 没法 import 运行时色表，所以由 tools/layered_smoke.py
# 的「启动屏底色 = 窗口底色」断言守住，换品牌色时同步改这里。
# spinner 是刻意低对比的装饰色，不进语义色表。
[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
bgcolor_light = "#141518"
bgcolor_dark = "#141518"
spinner_color_light = "#3d3d3d"
spinner_color_dark = "#3d3d3d"
theme_mode = "dark"

[tool.flet.compile]
# 预编译 .py 为 .pyc：内嵌解释器启动时省掉源码编译，冷启动更快
app = true
packages = false
cleanup = false

[tool.flet.windows]
# 只写产品名：flet 会自己补 .exe，写成 "ImageViewer.exe" 会产出 ImageViewer.exe.exe
artifact = "ImageViewer"
# flet build 只读取 project.dependencies，可选格式依赖需在此显式声明才会打进桌面包
dependencies = [
    "pillow-heif>=1.0",
    "rawpy>=0.20",
    "resvg>=0.2.0",
    "apng>=0.3",
]
